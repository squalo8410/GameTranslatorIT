name: Rilascio GameTranslator IT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da rilasciare (formato X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installazione .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determina versione e tag
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { $version = $env:REF_NAME -replace '^[vV]', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Versione non valida: '$version'. Usa il formato X.Y.Z." }
          $tag = "v$version"

          if (-not (git rev-parse -q --verify "refs/tags/$tag")) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "GameTranslator IT $version"
            git push origin $tag
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Versione: $version — tag: $tag"

      - name: Allinea la versione nei file sorgente
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .\Set-Version.ps1 -Version $env:VERSION

      - name: Prepara il certificato MSIX (facoltativo)
        id: msix
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "MSIX_PFX_BASE64 non configurato: verranno pubblicati EXE e ZIP."
            Write-Host "Configura i secret MSIX_PFX_BASE64 e MSIX_PFX_PASSWORD per includere l'MSIX firmato."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) { throw "MSIX_PFX_PASSWORD non configurato." }

          $pfx = Join-Path $env:RUNNER_TEMP 'GameTranslatorIT-release.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          "skip=false" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          Write-Host "Certificato MSIX preparato (non verrà pubblicato)."

      - name: Installazione Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe non trovato dopo l'installazione." }
          Write-Host "ISCC disponibile: $iscc"

      - name: Prepara la versione precedente per l'aggiornamento differenziale
        id: delta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $previous = $null
          try {
            $releases = & gh release list --repo $env:GITHUB_REPOSITORY --limit 20 `
                --json tagName,isDraft,isPrerelease 2>$null | ConvertFrom-Json
            $previous = @($releases | Where-Object {
              -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne "v$env:VERSION"
            } | Select-Object -First 1).tagName
          }
          catch { Write-Host "Nessuna release precedente utilizzabile: $($_.Exception.Message)" }

          if ([string]::IsNullOrWhiteSpace($previous)) {
            Write-Host "Nessuna baseline: l'archivio delta conterrà tutti i file dell'app."
            exit 0
          }

          $download = Join-Path $env:RUNNER_TEMP 'gtit-delta-download'
          $extract = Join-Path $env:RUNNER_TEMP 'gtit-delta-base'
          New-Item -ItemType Directory -Force -Path $download, $extract | Out-Null
          & gh release download $previous --repo $env:GITHUB_REPOSITORY `
              --pattern 'GameTranslatorIT-Portable-*.zip' --dir $download 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Download della baseline $previous non riuscito: si procede senza delta."
            exit 0
          }
          $zip = @(Get-ChildItem -LiteralPath $download -Filter '*.zip' | Where-Object {
            $_.Name -notmatch 'Essenziali|Completo'
          } | Select-Object -First 1)
          if ($zip.Count -eq 0) { Write-Host "ZIP portable non trovato in ${previous}: si procede senza delta."; exit 0 }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $extract -Force
          $app = @(Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1)
          if ($app.Count -eq 0) { Write-Host "Cartella app non trovata: si procede senza delta."; exit 0 }
          "base=$($app[0].FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Baseline differenziale: $($app[0].FullName) (release $previous)"

      - name: Compila EXE, ZIP, MSIX, manifest e checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PFX_PATH: ${{ steps.msix.outputs.pfx }}
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          MSIX_SKIP: ${{ steps.msix.outputs.skip }}
          DELTA_BASE: ${{ steps.delta.outputs.base }}
        run: |
          # I modelli (~10 GB) superano il limite GitHub di 2 GB: gli asset
          # GameTranslatorIT-Models*.zip e le portable con modelli vengono caricati
          # separatamente dalla build locale. La CI pubblica EXE, portable standard,
          # MSIX, archivio/manifest del differenziale e i relativi .sha256.
          $params = @('-Version', $env:VERSION, '-SkipModelAssets')
          if (-not [string]::IsNullOrWhiteSpace($env:DELTA_BASE)) { $params += @('-DeltaBasePath', $env:DELTA_BASE) }
          if ($env:MSIX_SKIP -eq 'false') {
            $params += @('-PfxPath', $env:PFX_PATH, '-PfxPassword', $env:PFX_PASSWORD)
          }
          else {
            $params += '-SkipMsix'
          }
          & .\BuildRelease.ps1 @params
          if ($LASTEXITCODE -ne 0) { throw "BuildRelease.ps1 non riuscita." }

      - name: Pubblica la release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releaseDir = Join-Path $PWD "dist\Releases\v$env:VERSION"
          $notes = Join-Path $releaseDir 'release-notes.md'
          if (-not (Test-Path -LiteralPath $notes)) { throw "Note di rilascio mancanti: $notes" }

          $assets = Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Extension -in @('.exe', '.zip', '.msix', '.sha256', '.json') } |
            ForEach-Object { $_.FullName }

          if ($assets.Count -lt 4) { throw "Asset insufficienti per la release: $($assets.Count)" }

          $existing = & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $env:TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Caricamento degli asset non riuscito." }
              Write-Host "Release esistente aggiornata: $env:TAG"
          }
          else {
              & gh release create $env:TAG `
                  --title "GameTranslator IT $env:VERSION" `
                  --notes-file $notes `
                  --verify-tag @assets
              if ($LASTEXITCODE -ne 0) { throw "Pubblicazione della release non riuscita." }
              Write-Host "Release pubblicata: $env:TAG"
          }
